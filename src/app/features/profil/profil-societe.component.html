<div class="space-y-6">
  <div>
    <h1 class="text-2xl font-bold tracking-tight text-brand-secondary">Profil de la société</h1>
    <p class="text-xs sm:text-sm text-gray-600 mt-1">
      Coordonnées publiques, références légales et dossier d’agrément de votre société promotrice.
    </p>
  </div>

  <app-statut-agrement-banner [agrementStatut]="profil().agrementStatut" />

  <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
    <div class="lg:col-span-7 space-y-6">
      <app-identite-form [profil]="profil()" />
      <app-regles-reservation [profil]="profil()" />
    </div>

    <div class="lg:col-span-5 space-y-6">
      <app-references-legales [profil]="profil()" />
      <app-responsable-legal [user]="utilisateur()" />
      <app-dossier-kyc [documents]="documents()" [chargement]="chargementKyc()" />
    </div>
  </div>
</div>
