<div
  class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 backdrop-blur-xs p-4 animate-fadeIn"
  role="dialog"
  aria-modal="true"
  (click)="fermer()"
>
  <div
    class="bg-white rounded-2xl w-full max-w-lg overflow-hidden border border-gray-100 shadow-card"
    (click)="$event.stopPropagation()"
  >
    <div class="px-6 py-4 border-b border-gray-100 flex items-center justify-between">
      <h3 class="text-base font-bold text-brand-secondary">
        {{ commodite() ? 'Modifier la commodité' : 'Nouvelle commodité de proximité' }}
      </h3>
      <button (click)="fermer()" class="text-gray-400 hover:text-gray-600 text-lg cursor-pointer">✕</button>
    </div>

    <form [formGroup]="form" (ngSubmit)="enregistrer()" class="p-6 space-y-4">
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-semibold text-gray-700 uppercase mb-1">Nom *</label>
          <input type="text" formControlName="nom" placeholder="Ex. CSCOM de Kalaban" class="w-full px-3.5 py-2.5 text-xs rounded-xl border border-gray-200 bg-gray-50 focus:bg-white focus:ring-2 focus:ring-brand-primary focus:outline-none shadow-card" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-700 uppercase mb-1">Type *</label>
          <select formControlName="typeCommoditeId" class="w-full px-3.5 py-2.5 text-xs rounded-xl border border-gray-200 bg-gray-50 focus:bg-white focus:ring-2 focus:ring-brand-primary focus:outline-none shadow-card">
            <option [ngValue]="null" disabled>Choisir un type</option>
            @for (type of types(); track type.id) {
              <option [ngValue]="type.id">{{ type.libelle }}</option>
            }
          </select>
        </div>
      </div>

      <div>
        <label class="block text-xs font-semibold text-gray-700 uppercase mb-1">Description</label>
        <input type="text" formControlName="description" class="w-full px-3.5 py-2.5 text-xs rounded-xl border border-gray-200 bg-gray-50 focus:bg-white focus:ring-2 focus:ring-brand-primary focus:outline-none shadow-card" />
      </div>

      <div>
        <p class="text-xs font-semibold text-gray-700 uppercase mb-1">Position GPS (facultatif)</p>
        <p class="text-[11px] text-gray-500 mb-2">
          Permet d'afficher la commodité sur la carte de l'application et de calculer la distance automatiquement.
        </p>
        <div class="grid grid-cols-2 gap-3">
          <input type="number" step="0.000001" formControlName="latitude" placeholder="Latitude (12.639200)" class="w-full px-3.5 py-2.5 text-xs rounded-xl border border-gray-200 bg-gray-50 focus:bg-white focus:ring-2 focus:ring-brand-primary focus:outline-none shadow-card" />
          <input type="number" step="0.000001" formControlName="longitude" placeholder="Longitude (-8.002900)" class="w-full px-3.5 py-2.5 text-xs rounded-xl border border-gray-200 bg-gray-50 focus:bg-white focus:ring-2 focus:ring-brand-primary focus:outline-none shadow-card" />
        </div>
      </div>

      <div class="pt-4 border-t border-gray-100 flex items-center justify-end gap-3">
        <button type="button" (click)="fermer()" class="bouton bouton-discret">
          Annuler
        </button>
        <button
          type="submit"
          [disabled]="form.invalid || isSubmitting()"
          class="bouton bouton-primaire"
        >
          {{ isSubmitting() ? 'Enregistrement…' : 'Enregistrer' }}
        </button>
      </div>
    </form>
  </div>
</div>
