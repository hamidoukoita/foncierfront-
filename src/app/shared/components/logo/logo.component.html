<div
  class="inline-flex flex-col gap-1 select-none"
  [class.items-center]="centre()"
  [class.items-start]="!centre()"
  [class.cursor-pointer]="clickable()"
>
  <img [src]="src()" alt="Foncier+" [class]="hauteurClass()" class="w-auto max-w-full shrink-0" draggable="false" />

  @if (subtitle()) {
    <span
      class="text-[9px] uppercase tracking-wider font-bold"
      [class.text-gray-300]="darkTheme()"
      [class.text-gray-500]="!darkTheme()"
    >
      {{ subtitle() }}
    </span>
  }
  @if (isSuperAdmin()) {
    <span
      class="inline-block text-[9px] font-bold px-1.5 py-0.5 rounded tracking-wider uppercase text-center shadow-2xs border"
      [class.bg-white/10]="darkTheme()"
      [class.text-amber-400]="darkTheme()"
      [class.border-amber-400/40]="darkTheme()"
      [class.bg-brand-secondary]="!darkTheme()"
      [class.text-white]="!darkTheme()"
      [class.border-transparent]="!darkTheme()"
    >
      RÉGULATION DNCG
    </span>
  }
</div>
