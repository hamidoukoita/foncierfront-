<div class="py-12 px-4 text-center bg-white rounded-2xl border border-dashed border-gray-200 shadow-card">
  <div class="w-14 h-14 mx-auto rounded-full bg-orange-50 text-brand-primary flex items-center justify-center text-2xl mb-3 shadow-inner">
    {{ icon() }}
  </div>
  <h3 class="text-base font-bold text-gray-800 tracking-tight mb-1">
    {{ title() }}
  </h3>
  <p class="text-xs text-gray-500 max-w-sm mx-auto mb-4">
    {{ message() }}
  </p>
  <ng-content select="[action]"></ng-content>
</div>
