<div [class]="borderAccentClass()" class="stats-card-wrapper bg-white px-4 py-4 py-md-4 rounded-2xl -[0_12px_24px_-6px_rgba(26,40,64,0.07),0_4px_8px_-4px_rgba(26,40,64,0.04)] border border-[#E2DDD5]/80 flex items-center gap-4 transition-all duration-200 hover:-[0_16px_32px_-8px_rgba(26,40,64,0.12)] hover:-translate-y-0.5 h-100 shadow-card">
  <!-- Icône avec conteneur rond adouci et dégradé subtil -->
  <div class="stats-icon-box rounded-2xl bg-gradient-to-b from-[var(--foncier-bg)] to-[#ECE7DE] border border-[#E2DDD5] shadow-xs flex items-center justify-center shrink-0 text-gray-700">
    <ng-content select="[icon]"></ng-content>
  </div>

  <!-- Contenu Texte -->
  <div class="flex-1 min-w-0">
    <p class="text-xs md:text-sm font-semibold text-gray-600 truncate mb-1.5">
      {{ label() }}
    </p>
    <div class="flex items-baseline gap-2.5">
      <span class="text-2xl md:text-3xl font-extrabold text-brand-secondary tracking-tight">
        {{ value() }}
      </span>
      @if (subtext()) {
        <span class="text-xs font-medium text-gray-500 flex items-center gap-1.5 truncate">
          @if (subtextBadge()) {
            <span [class]="dotColorClass()" class="inline-block w-2 h-2 rounded-full"></span>
          }
          <span>{{ subtext() }}</span>
        </span>
      }
    </div>
  </div>
</div>
