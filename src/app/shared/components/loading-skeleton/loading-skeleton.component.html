<div class="animate-pulse space-y-4 p-4 bg-white rounded-2xl border border-gray-100 shadow-card">
  @for (i of rowsArray(); track i) {
    <div class="flex items-center gap-4">
      <div class="w-12 h-12 bg-gray-200 rounded-xl shrink-0"></div>
      <div class="flex-1 space-y-2">
        <div class="h-4 bg-gray-200 rounded-md w-1/3"></div>
        <div class="h-3 bg-gray-100 rounded-md w-2/3"></div>
      </div>
      <div class="w-20 h-7 bg-gray-200 rounded-full shrink-0"></div>
      <div class="w-16 h-7 bg-gray-100 rounded-lg shrink-0"></div>
    </div>
  }
</div>
