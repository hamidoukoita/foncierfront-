<div class="flex items-center justify-between py-4 text-xs text-gray-500">
  <div>
    @if (totalItems() > 0) {
      <span>Affichage de {{ startItem() }} à {{ endItem() }} sur {{ totalItems() }} éléments</span>
    }
  </div>

  <div class="flex items-center gap-1.5">
    <button 
      type="button" 
      [disabled]="currentPage() <= 1"
      (click)="pageChange.emit(currentPage() - 1)"
      class="w-7 h-7 flex items-center justify-center rounded-md border border-gray-200 bg-white text-gray-600 hover:bg-gray-50 disabled:opacity-40 disabled:cursor-not-allowed cursor-pointer transition-colors shadow-card">
      ‹
    </button>

    @for (p of pages(); track p) {
      <button 
        type="button" 
        (click)="pageChange.emit(p)"
        [class]="p === currentPage() ? 'bg-brand-secondary text-white border-brand-secondary font-bold shadow-xs' : 'bg-white text-gray-700 border-gray-200 hover:bg-gray-50'"
        class="w-7 h-7 flex items-center justify-center rounded-md border text-xs cursor-pointer transition-colors">
        {{ p }}
      </button>
    }

    <button 
      type="button" 
      [disabled]="currentPage() >= totalPages()"
      (click)="pageChange.emit(currentPage() + 1)"
      class="w-7 h-7 flex items-center justify-center rounded-md border border-gray-200 bg-white text-gray-600 hover:bg-gray-50 disabled:opacity-40 disabled:cursor-not-allowed cursor-pointer transition-colors shadow-card">
      ›
    </button>
  </div>
</div>
