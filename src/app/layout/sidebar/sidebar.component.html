<aside
  class="sidebar-wrapper d-flex flex-column justify-content-between bg-white border-end h-100 select-none"
  style="width: 280px; border-color: var(--foncier-border) !important"
>
  <!-- En-tête : Logo Foncier+ officiel avec badge Super Admin et espacement aéré -->
  <div
    class="p-3.5 px-4 border-bottom d-flex align-items-center justify-content-between"
    style="border-color: #f1ece1 !important"
  >
    <app-logo [size]="'md'" [isSuperAdmin]="authService.isPlatformAdmin()"></app-logo>
  </div>

  <!-- Navigation dynamique cloisonnée avec espacement et respiration -->
  <nav class="flex-grow-1 px-2.5 py-3.5 overflow-y-auto">
    <div
      class="px-3 pb-3 text-uppercase fw-bold text-muted small"
      style="font-size: 11px; letter-spacing: 0.9px; color: #94a3b8 !important"
    >
      {{ navHeaderTitle() }}
    </div>

    <div class="d-flex flex-column gap-2 px-1">
      @for (item of currentNavItems(); track item.route) {
        <a
          [routerLink]="item.route"
          routerLinkActive="active-nav"
          [routerLinkActiveOptions]="{
            exact: item.route === '/admin/dashboard' || item.route === '/societe/dashboard',
          }"
          (click)="linkClicked.emit()"
          matRipple
          class="sidebar-nav-link d-flex align-items-center justify-content-between px-3.5 py-3 rounded-3 text-decoration-none text-dark fw-semibold"
        >
          <div class="d-flex align-items-center gap-3">
            <mat-icon
              class="sidebar-icon shrink-0"
              style="font-size: 22px; width: 22px; height: 22px"
            >
              {{ item.icon }}
            </mat-icon>
            <span class="text-truncate" style="font-size: 14px; letter-spacing: -0.1px">{{
              item.label
            }}</span>
          </div>

          @if (item.badge) {
            <span
              class="badge rounded-pill bg-warning-subtle text-dark border border-warning-subtle px-2.5 py-1 fw-bold"
              style="font-size: 11px"
            >
              {{ item.badge }}
            </span>
          }
        </a>
      }
    </div>
  </nav>

  <!-- Pied de Sidebar : Déconnexion avec icône Material et touche généreuse -->
  <div
    class="p-3.5 px-4 border-top"
    style="border-color: #f1ece1 !important; background-color: #faf8f5"
  >
    <button
      type="button"
      (click)="onLogout()"
      matRipple
      class="btn btn-outline-danger w-100 d-flex align-items-center justify-content-center gap-2 py-2.5 rounded-3 fw-bold border-0 text-danger bg-danger-subtle bg-opacity-25 shadow-2xs"
      style="font-size: 13.5px"
    >
      <mat-icon style="font-size: 20px; width: 20px; height: 20px">logout</mat-icon>
      <span>Déconnexion</span>
    </button>
  </div>
</aside>
